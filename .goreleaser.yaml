version: 2
project_name: telegram-cli
changelog:
  disable: true
builds:
  - id: telegram-cli
    main: ./cmd/telegram-cli
    binary: telegram-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X telegram-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: telegram-mcp
    main: ./cmd/telegram-mcp
    binary: telegram-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: telegram-cli
    repository:
      owner: qmahyar
      name: homebrew-tap
    homepage: "https://github.com/qmahyar/telegram-cli"
    description: "Every Telegram account you own in one terminal: unified sync and search, flood-aware cross-account broadcasts, and a schema-driven raw gateway no other Telegram CLI offers."
    install: |
      bin.install "telegram-cli"
      bin.install "telegram-mcp"

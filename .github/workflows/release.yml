name: release

# Fired by `git push origin v<semver>` (see RELEASING.md — the tag IS the
# version; there is no separate version bump). Builds the binary matrix for
# every platform and attaches it to a GitHub Release. The final step
# explicitly dispatches npm-publish.yml so the npm package ships at the same
# version (workflow_dispatch is more reliable than the "release: published"
# event for bot-created releases).
on:
  push:
    tags:
      - "v*"

# actions: write is required so the final step can dispatch npm-publish.yml
# (workflow_dispatch via the API needs it; contents: write is for the release
# assets). The npm publish chain is the separate npm-publish.yml workflow.
permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build dist matrix
        run: bash scripts/dist.sh "$GITHUB_REF_NAME"
        shell: bash

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Explicitly chain the npm publish instead of relying on the
      # "release: published" event, which does not fire reliably for
      # bot-created releases. npm-publish.yml is workflow_dispatch-only;
      # without NPM_TOKEN it reports a skip with the manual fallback.
      - name: Dispatch npm publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run npm-publish.yml -f tag="$GITHUB_REF_NAME"

      - name: Report
        run: |
          echo "Release $GITHUB_REF_NAME assets:"
          ls -1 dist
          echo "npm publish dispatched to npm-publish.yml (workflow_dispatch)."
